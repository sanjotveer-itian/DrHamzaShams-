<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Humza Shams – Walk into the clinic</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f9f8;--card:#fff;--ink:#0d2745;--mute:#4d6479;--teal:#0f8f7c;--mint:#d8f0ea;--line:#d3e4e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08182b;--card:#0f2640;--ink:#e8f3f1;--mute:#9db5c4;--teal:#34c3ab;--mint:#123a45;--line:#1d3b57}}
:root[data-theme=dark]{--bg:#08182b;--card:#0f2640;--ink:#e8f3f1;--mute:#9db5c4;--teal:#34c3ab;--mint:#123a45;--line:#1d3b57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0a1f38;color:#eaf6f3;font:400 16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.12;margin:0 0 .45em;letter-spacing:-.01em}
p{margin:0 0 1em}
:focus-visible{outline:3px solid #7fe3d0;outline-offset:3px;border-radius:8px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 68px);width:min(520px,calc(100% - 28px));background:rgba(10,31,56,.8);backdrop-filter:blur(10px);border:1px solid rgba(127,227,208,.28);border-radius:22px;padding:20px 22px}
#card.in{animation:up .5s .6s backwards}
@keyframes up{from{opacity:0;margin-bottom:-12px}}
#card h2{font-size:1.5rem}#card.big h2{font-size:clamp(1.7rem,6vw,2.4rem)}
#card p{color:#b8d4d9;margin:0 0 14px}
#card small{display:block;margin-top:10px;color:#8fb2b8}
.btn{display:inline-flex;align-items:center;padding:12px 22px;border-radius:99px;font:700 1rem Figtree,sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer;background:#34c3ab;color:#06231f}
.btn:hover{filter:brightness(1.08)}.btn.g{background:transparent;border-color:currentColor;color:var(--ink)}
#dots{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:2px;background:rgba(10,31,56,.8);backdrop-filter:blur(10px);border-radius:99px;padding:4px;max-width:calc(100% - 20px)}
#dots button{border:0;background:none;color:#b8d4d9;font:500 .88rem Figtree,sans-serif;padding:8px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
#dots button[aria-current=step]{background:#eaf6f3;color:#0d2745}
#panel{position:fixed;inset:0;overflow-y:auto;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);color:var(--ink);opacity:0;transition:opacity .5s;padding:calc(env(safe-area-inset-top,0px) + 70px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
#panel.on{opacity:1}#panel[hidden]{display:none}
#panel p{color:var(--mute);max-width:62ch}
#back{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;background:var(--ink);color:var(--bg)}
.w{max-width:960px;margin:0 auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.card.a{border-top:6px solid var(--teal)}.card.b{border-top:6px solid #1e5fa8}
.card p:last-child{margin:0}
.pt{width:130px;aspect-ratio:4/5;border-radius:24px;background:linear-gradient(160deg,#0d2745,#14507a 60%,#0f8f7c);display:grid;place-items:center;color:#fff;font:700 3rem Fraunces,serif;margin-bottom:20px}
.pills{display:flex;flex-wrap:wrap;gap:10px}.pills span{background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;font-weight:700}
ul.t{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}ul.t li:before{content:"✓ ";color:var(--teal);font-weight:700}
.note{background:var(--mint);border-radius:22px;padding:22px 26px;margin-top:22px}.note p{color:var(--ink);margin:0}
dl{display:grid;gap:12px;margin:14px 0}dt{font-weight:700}dd{margin:0;color:var(--mute)}dd a{color:inherit}
form{display:grid;gap:12px}label{display:grid;gap:6px;font-weight:700}
input,select{font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
@media(prefers-reduced-motion:reduce){#card.in{animation:none}#panel{transition:none}}
</style></head>
<body>
<canvas id="c" aria-label="3D walk from the clinic gate to each section"></canvas>
<div id="card" role="region" aria-live="polite"></div>
<nav id="dots" aria-label="Sections"></nav>
<button id="back" class="btn" hidden>Back to path</button>
<div id="panel" hidden tabindex="-1"><div class="w" id="pc"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const S=[
{n:'Gate',t:'Clear answers from accurate diagnosis.',d:'Dr. Humza Shams is a General Practitioner and Sonologist. OPD and ultrasound at Al Humza Clinic (Sat & Sun) and LUMHS DRL, Hyderabad (Mon–Fri).',b:'Open the gate',h:'Then scroll, swipe or press the arrow keys to walk.'},
{n:'About',s:-1,u:'MBBS, RMP, Sonologist',t:'About Dr. Humza',d:'One doctor to examine you, scan you and explain the result.'},
{n:'Services',s:1,u:'OPD and ultrasound',t:'Services',d:'General OPD and ultrasound, split by location.'},
{n:'Locations',s:-1,u:'Addresses and timings',t:'Locations & timings',d:'Weekends in KGM, weekdays in Hyderabad.'},
{n:'Book',s:1,u:'Request a visit',t:'Book an appointment',d:'Pick a location, send your request, and the clinic will confirm.'}];
S.forEach((s,i)=>{s.z=i?-14-16*(i-1):16;if(i)s.b='Enter '+s.n});
const C={
about:`<div class="pt" role="img" aria-label="Initials HS">HS</div><h2>Healthy you, happier tomorrow</h2><div class="pills"><span>MBBS</span><span>RMP</span><span>Sonologist</span></div><p style="margin-top:18px">Dr. Humza Shams combines general practice with diagnostic ultrasound. That means one doctor can examine you, scan you and explain the result in the same visit.</p><p>He sees patients at Al Humza Clinic on weekends and at the LUMHS Diagnostic and Research Laboratory on weekdays, so care is available every day of the week.</p><div class="cols"><div class="card"><h3>Accurate diagnosis</h3><p>High-resolution imaging helps find the cause, not just the symptom.</p></div><div class="card"><h3>Better health</h3><p>Clear explanations so you know what the findings mean and what to do next.</p></div><div class="card"><h3>Public service</h3><p>The LUMHS laboratory is a diagnostic public service provided by LUMHS DRL.</p></div></div>`,
services:`<h2>Services</h2><div class="cols"><div class="card a"><h3>Al Humza Clinic</h3><p>OPD & Ultrasound Services</p><ul class="t"><li>General consultation</li><li>General OPD</li><li>Ultrasound (USG)</li></ul></div><div class="card b"><h3>LUMHS Diagnostic Laboratory</h3><p>Ultrasound services</p><ul class="t"><li>Ultrasound abdomen & pelvis</li><li>KUB (kidney, ureter, bladder)</li><li>Prostate scan</li><li>Obstetrics & gynaecology ultrasound</li></ul></div></div><div class="note"><h3>Research opportunity</h3><p>As part of its commitment to diagnostic research, the LUMHS laboratory offers these services at special research rates, with high-resolution imaging.</p></div>`,
locations:`<h2>Locations & timings</h2><div class="cols"><div class="card a"><h3>Al Humza Clinic</h3><dl><div><dt>Address</dt><dd>Opposite Taluka Hospital KGM</dd></div><div><dt>Days</dt><dd>Saturday & Sunday</dd></div><div><dt>Time</dt><dd>10:00 AM – 8:00 PM</dd></div><div><dt>Appointments</dt><dd>WhatsApp 0308-3752838</dd></div></dl><a class="btn" href="https://wa.me/923083752838" rel="noopener">Message on WhatsApp</a></div><div class="card b"><h3>LUMHS Diagnostic & Research Laboratory</h3><dl><div><dt>Address</dt><dd>Hala Naka Road Branch, Opposite ISRA Hospital, Hyderabad</dd></div><div><dt>Days</dt><dd>Monday to Friday</dd></div><div><dt>Time</dt><dd>10:00 AM – 6:00 PM</dd></div><div><dt>Appointments</dt><dd>Call 022-2031822</dd></div></dl><a class="btn g" href="tel:0222031822">Call 022-2031822</a></div></div>`,
book:`<h2>Book an appointment</h2><div class="cols"><div class="card"><h3>Request a visit</h3><form id="f"><label>Your name<input id="n" required autocomplete="name"></label><label>Location<select id="l"><option value="wa">Al Humza Clinic, KGM (Sat & Sun)</option><option value="tel">LUMHS DRL, Hyderabad (Mon–Fri)</option></select></label><label>Service<select id="s"><option>General consultation / OPD</option><option>Ultrasound abdomen & pelvis</option><option>KUB ultrasound</option><option>Prostate scan</option><option>Obstetrics & gynaecology ultrasound</option></select></label><label>Preferred day<input id="d" placeholder="e.g. Saturday"></label><button class="btn" type="submit">Send request</button><p id="m" style="margin:0" role="status"></p></form></div><div class="card a"><h3>Reach us directly</h3><dl><div><dt>Al Humza Clinic (WhatsApp)</dt><dd><a href="https://wa.me/923083752838">0308-3752838</a></dd></div><div><dt>LUMHS DRL (phone)</dt><dd><a href="tel:0222031822">022-2031822</a></dd></div></dl><p>For the clinic, the form opens WhatsApp with your request filled in. For the laboratory, please call during working hours.</p></div></div>`};
const K=['','about','services','locations','book'];

/* ---------- scene ---------- */
const V=THREE.Vector3,cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0a1f38);sc.fog=new THREE.Fog(0x0a1f38,16,75);
const cam=new THREE.PerspectiveCamera(60,1,.1,300);
sc.add(new THREE.HemisphereLight(0x9fd8cf,0x0d2745,1));
const dl=new THREE.DirectionalLight(0xffffff,.55);dl.position.set(6,12,10);sc.add(dl);
const M=(c,e,i)=>new THREE.MeshStandardMaterial({color:c,roughness:.85,emissive:e||0,emissiveIntensity:i||1});
const box=(w,h,d,x,y,z,m,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(p||sc).add(o);return o};
function lab(t,u,w,h){const k=110,c=document.createElement('canvas');c.width=w*k;c.height=h*k;const g=c.getContext('2d');
g.fillStyle='#0d2745';g.fillRect(0,0,c.width,c.height);g.strokeStyle='#34c3ab';g.lineWidth=6;g.strokeRect(6,6,c.width-12,c.height-12);
g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font=`700 ${h*k*(u?.4:.5)}px Fraunces,Georgia,serif`;g.fillText(t,c.width/2,c.height*(u?.38:.5));
if(u){g.fillStyle='#7fe3d0';g.font=`500 ${h*k*.19}px Fraunces,Georgia,serif`;g.fillText(u,c.width/2,c.height*.74)}
return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}))}
const leaves=[],doors=[],arcs=[];let fan;
function build(){
box(160,.2,240,0,-.1,-60,M(0x0b2a2e));
box(8,.24,240,0,-.08,-60,M(0x2d6168));
/* gate */
[-1,1].forEach(sd=>{box(1.1,6.4,1.1,sd*4.55,3.2,0,M(0x143a52));box(1.5,.35,1.5,sd*4.55,6.5,0,M(0x0f8f7c,0x0f8f7c,.4));
box(26,3,1,sd*18,1.5,0,M(0x143a52));
const g=new THREE.Group();g.position.set(sd*4,0,0);sc.add(g);
box(3.9,4.6,.15,-sd*1.95,2.3,0,M(0x0d2745),g);box(3.7,.12,.2,-sd*1.95,1.3,0,M(0x34c3ab,0x34c3ab,.6),g);box(3.7,.12,.2,-sd*1.95,3.5,0,M(0x34c3ab,0x34c3ab,.6),g);
g.userData.sd=sd;leaves.push(g)});
box(10.2,1,1.1,0,6.2,0,M(0x0d2745));
const sg=lab('Dr. Humza Shams','Sonologist & General Practitioner',8,1.8);sg.position.set(0,7.9,0);sc.add(sg);
/* ultrasound sweep over the gate */
const ap=new THREE.Group();ap.position.set(0,5.65,.7);sc.add(ap);
fan=new THREE.Group();ap.add(fan);
fan.add(new THREE.Mesh(new THREE.CircleGeometry(3.9,32,Math.PI*1.35,Math.PI*.3),new THREE.MeshBasicMaterial({color:0x7fe3d0,transparent:true,opacity:.28,side:2,depthWrite:false})));
[1.4,2.4,3.4].forEach((r,i)=>{const a=new THREE.Mesh(new THREE.TorusGeometry(r,.04,8,64,Math.PI),new THREE.MeshBasicMaterial({color:0x7fe3d0,transparent:true,opacity:.5}));a.rotation.z=Math.PI;ap.add(a);arcs.push(a)});
/* lamps */
for(let z=8;z>-80;z-=8)[-1,1].forEach(sd=>{box(.12,3.2,.12,sd*3.3,1.6,z,M(0x1d3b57));
const b=new THREE.Mesh(new THREE.SphereGeometry(.22,12,8),new THREE.MeshBasicMaterial({color:0xfff1c9}));b.position.set(sd*3.3,3.3,z);sc.add(b)});
/* buildings with doors */
S.forEach((s,i)=>{if(!i)return;const sd=s.s,z=s.z,fx=sd*6;
box(8,6,13,sd*10,3,z,M([0x143a52,0x164a55,0x1a3555,0x12414a][i-1]));
box(.35,3.5,2.4,fx-sd*.05,1.75,z,M(0x0f8f7c,0x0f8f7c,.5));
const dm=M(0xd8f0ea,0xd8f0ea,.4);box(.2,3.1,1.9,fx-sd*.15,1.55,z,dm);doors[i]=dm;
box(1.8,.16,3.2,fx-sd*.8,3.65,z,M(0x0d2745));
[-4.2,4.2].forEach(o=>box(.1,1.4,1.3,fx-sd*.05,2.3,z+o,M(0x222222,0xffd98a,.7)));
const sn=lab(s.n,s.u,4.4,1.4);sn.position.set(fx-sd*.08,4.8,z);sn.rotation.y=-sd*Math.PI/2;sc.add(sn)});
/* sky */
const sp=[];for(let i=0;i<350;i++){const a=Math.random()*6.283,e=Math.random()*1.2+.1,r=200;sp.push(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r,Math.sin(a)*Math.cos(e)*r)}
const sg2=new THREE.BufferGeometry();sg2.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
sc.add(new THREE.Points(sg2,new THREE.PointsMaterial({color:0xcfeee8,size:1.6,sizeAttenuation:false,fog:false})));
const mn=new THREE.Mesh(new THREE.SphereGeometry(7,24,16),new THREE.MeshBasicMaterial({color:0xeaf6f3,fog:false}));mn.position.set(-60,70,-160);sc.add(mn);
loop()}

/* ---------- camera path ---------- */
const T=S.map((s,i)=>i?{p:new V(0,1.7,s.z),l:new V(s.s*6,1.9,s.z)}:{p:new V(0,2.5,16),l:new V(0,3.6,0)});
const pos=T[0].p.clone(),look=T[0].l.clone(),tp=T[0].p.clone(),tl=T[0].l.clone();
let idx=0,inside=false,open=0,last=performance.now(),walk=0;
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min((now-last)/1000,.1);last=now;const t=now/1000;
const k=RM?1:1-Math.exp(-dt*(inside?3.2:2.4));const pr=pos.clone();
pos.lerp(tp,k);look.lerp(tl,k);walk+=pos.distanceTo(pr)*3;
cam.position.set(pos.x,pos.y+(RM?0:Math.sin(walk)*.05),pos.z);cam.lookAt(look);
open+=((idx>0?1:0)-open)*(RM?1:1-Math.exp(-dt*1.6));
leaves.forEach(g=>g.rotation.y=-g.userData.sd*Math.PI/2*open);
fan.rotation.z=RM?0:Math.sin(t*1.1)*.42;
arcs.forEach((a,i)=>a.material.opacity=RM?.5:.3+.25*Math.sin(t*2-i*.8));
doors.forEach((m,i)=>m.emissiveIntensity=i===idx?(RM?.8:.75+.3*Math.sin(t*3)):.3);
R.render(sc,cam)}
function fit(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<1?78:60;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

/* ---------- UI ---------- */
const card=document.getElementById('card'),dots=document.getElementById('dots'),panel=document.getElementById('panel'),pc=document.getElementById('pc'),back=document.getElementById('back');
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n;b.onclick=()=>go(i);dots.append(b)});
function ui(){card.hidden=false;card.className='in'+(idx?'':' big');const s=S[idx];
card.innerHTML=`<${idx?'h2':'h1'}>${s.t}</${idx?'h2':'h1'}><p>${s.d}</p><button class="btn" id="eb">${s.b}</button>${s.h?`<small>${s.h}</small>`:''}`;
document.getElementById('eb').onclick=()=>idx?enter():go(1);
[...dots.children].forEach((b,i)=>i===idx?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current'))}
function go(i){if(inside)return;idx=Math.max(0,Math.min(S.length-1,i));tp.copy(T[idx].p);tl.copy(T[idx].l);ui()}
function enter(){if(inside||!idx)return;const s=S[idx];inside=true;card.hidden=true;
tp.set(s.s*7.6,1.6,s.z);tl.set(s.s*16,1.6,s.z);
setTimeout(()=>{pc.innerHTML=C[K[idx]];panel.hidden=false;back.hidden=false;panel.scrollTop=0;
requestAnimationFrame(()=>{panel.classList.add('on');back.focus({preventScroll:true})});
if(K[idx]==='book')form()},RM?0:1100)}
function leave(){if(!inside)return;panel.classList.remove('on');back.hidden=true;
setTimeout(()=>{panel.hidden=true},RM?0:450);inside=false;go(idx)}
back.onclick=leave;
function form(){document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();
const v=id=>document.getElementById(id).value,m=document.getElementById('m');
if(v('l')==='tel'){m.textContent='Please call 022-2031822 (Mon–Fri, 10 AM – 6 PM) to book at the LUMHS laboratory.';return}
const t=`Hello, I'm ${v('n')}. I'd like an appointment at Al Humza Clinic for: ${v('s')}. Preferred day: ${v('d')||'any weekend day'}.`;
window.open('https://wa.me/923083752838?text='+encodeURIComponent(t),'_blank','noopener');m.textContent='Opening WhatsApp with your request.'})}
/* input: wheel, swipe, keys */
let cool=0;cv.addEventListener('wheel',e=>{e.preventDefault();const n=Date.now();if(n<cool||Math.abs(e.deltaY)<20)return;cool=n+700;go(idx+(e.deltaY>0?1:-1))},{passive:false});
let ty=0;cv.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
cv.addEventListener('touchend',e=>{const d=ty-e.changedTouches[0].clientY;if(Math.abs(d)>50)go(idx+(d>0?1:-1))});
addEventListener('keydown',e=>{if(e.key==='Escape')return leave();if(inside)return;
if(['ArrowDown','ArrowRight'].includes(e.key))go(idx+1);else if(['ArrowUp','ArrowLeft'].includes(e.key))go(idx-1);
else if(e.key==='Enter'&&idx&&document.activeElement.tagName!=='BUTTON')enter()});
ui();
Promise.race([Promise.all([document.fonts.load('700 40px Fraunces'),document.fonts.load('500 40px Fraunces')]),new Promise(r=>setTimeout(r,1500))]).catch(()=>{}).then(build);
</script></body></html>
